<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>ARstore — Buy • Sell • Discover</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23000000'/><text x='50' y='72' font-size='58' text-anchor='middle' fill='%23ffffff'>AR</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <div class="net-badge online" id="netBadge"></div>

  <header id="topbar"></header>

  <main id="app" class="container py-4"></main>

  <footer class="footer">
    <p class="mb-2"><i class="bi bi-stars"></i> ARstore — white &amp; black marketplace. Works online &amp; offline.</p>
    <span class="cloud-badge local" id="cloudStatus">💾 Local only</span>
  </footer>

  <button class="fab" id="assistantFab" title="AI Assistant" onclick="App.UI.toggleChat()"><i class="bi bi-stars"></i></button>
  <div class="assistant" id="assistant"></div>

  <div id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js?v=6"></script>
  <script src="js/utils.js?v=6"></script>
  <script src="js/supabase.js?v=6"></script>
  <script src="js/store.js?v=6"></script>
  <script src="js/auth.js?v=6"></script>
  <script src="js/ai.js?v=6"></script>
  <script src="js/lens.js?v=6"></script>
  <script src="js/cloud.js?v=6"></script>
  <script src="js/imagegen.js?v=6"></script>
  <script src="js/views.js?v=6"></script>
  <script src="js/ui.js?v=6"></script>
  <script src="js/app.js?v=6"></script>

  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          reg.update().catch(function () {});
        }).catch(function () {});
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshing) return;
          refreshing = true;
          location.reload();
        });
      });
    }
  </script>
</body>
</html>
